name: Refresh pnpm lockfile and verify build

on:
  push:
    branches:
      - fix/postgres-deals-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-build:
    if: "${{ !contains(github.event.head_commit.message, '[lockfile-refresh]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - name: Resolve dependencies and regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Verify resolved security fixes
        run: |
          pnpm list @tanstack/react-start @tanstack/start-server-core --depth 3
          node -e "const fs=require('fs');const s=fs.readFileSync('pnpm-lock.yaml','utf8');if(!s.includes('specifier: 1.168.60'))process.exit(1)"
      - name: Build application
        run: pnpm run build
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "[lockfile-refresh] regenerate patched TanStack dependency graph"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "pnpm-lock.yaml is already current"
          fi
