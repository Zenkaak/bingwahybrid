name: Refresh Bun lockfile and verify build

on:
  push:
    branches:
      - fix/postgres-deals-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-build:
    if: "!contains(github.event.head_commit.message, '[lockfile-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Resolve dependencies and regenerate lockfile
        run: bun install
      - name: Build application
        run: bun run build
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "[lockfile-refresh] regenerate patched TanStack dependency graph"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "bun.lock is already current"
          fi
